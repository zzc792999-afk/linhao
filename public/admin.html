<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理后台 · 25计算机1</title><link rel="stylesheet" href="/style.css"></head><body class="admin-page"><header><a class="logo" href="/"><span class="logo-icon">&lt;/&gt;</span>25计算机1</a><nav><a href="/">返回班级首页 ↗</a></nav></header><main class="section admin-main"><div class="eyebrow">CLASS CONTROL ROOM</div><h1>班级管理室<span class="serif">。</span></h1><p class="small-note" id="admin-status" role="status">正在检查登录状态…</p><form id="admin-login" class="admin-login" hidden><h2>欢迎回来</h2><p class="small-note">请输入独立管理员密码，管理属于我们的班级空间。</p><label for="admin-password">管理员密码</label><input id="admin-password" type="password" autocomplete="current-password" required maxlength="128"><button class="button">登录管理后台 ↗</button></form><div id="admin-panel" hidden><div class="admin-top"><p>管理内容与班级首页同步。</p><button id="refresh-admin" class="button secondary">刷新数据</button><button id="logout" class="button secondary">退出登录</button></div><div id="admin-stats" class="stats-grid"></div><div class="admin-columns"><section><h2>公告与点名名单</h2><form id="settings-form"><label for="announcement">班级公告（最多 500 字）</label><textarea id="announcement" maxlength="500" placeholder="比如：周五下午一起拍班级合照。"></textarea><label for="roster">随机点名名单（每行一个名字，最多 100 人）</label><textarea id="roster" maxlength="1500" rows="7" placeholder="填写后，首页可以从全班名单中随机抽签。"></textarea><button class="button">保存公告与名单</button></form></section><section><h2>发起班级投票</h2><form id="poll-form"><label for="poll-title">投票题目</label><input id="poll-title" maxlength="80" required placeholder="下一次班级活动去哪里？"><label for="poll-options">选项（每行一项，共 2–6 项）</label><textarea id="poll-options" maxlength="190" rows="6" required placeholder="公园野餐&#10;一起打球&#10;看电影"></textarea><button class="button">发布投票 ↗</button></form></section></div><section class="admin-section"><h2>投票管理</h2><div id="manage-polls"></div></section><section class="admin-section"><h2>留言管理</h2><p class="small-note">删除后所有人都无法再查看，请确认后操作。</p><div id="manage-notes"></div><div class="pager"><button id="prev-page" class="button secondary">上一页</button><span id="page-label"></span><button id="next-page" class="button secondary">下一页</button></div></section><section class="admin-section"><h2>照片管理</h2><div id="manage-photos" class="album-grid"></div></section><div class="admin-columns admin-section"><section><h2>修改管理密码</h2><form id="password-form"><label for="old-password">当前密码</label><input id="old-password" type="password" autocomplete="current-password" required><label for="new-password">新密码（12–128 位）</label><input id="new-password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><button class="button">修改密码并退出所有会话</button></form></section><section><h2>最近管理记录</h2><div id="manage-audit"></div></section></div></div></main><script src="/admin-client.js"></script></body></html>
